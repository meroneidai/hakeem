# Host nginx for a native Hakeem server.
# PHP-FPM and PostgreSQL run on the host. Document root is the Laravel public/ folder.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name SERVER_NAME_PLACEHOLDER;
    root PROJECT_ROOT_PLACEHOLDER/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:PHP_FPM_SOCKET_PLACEHOLDER;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_HERMES_KEY $http_x_hermes_key;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
