# Host nginx for Hakeem. PHP, Composer, and PostgreSQL run in Docker.
# This file only proxies the domain to the container. Do not point
# root at /var/hakeem/public on the host — there is no host PHP-FPM.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name SERVER_NAME_PLACEHOLDER;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:DOCKER_PORT_PLACEHOLDER;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Hermes-Key $http_x_hermes_key;
        proxy_read_timeout 120s;
    }
}
