[program:hakeem-queue]
command=PHP_BIN_PLACEHOLDER PROJECT_ROOT_PLACEHOLDER/artisan queue:work --sleep=3 --tries=3 --timeout=90
directory=PROJECT_ROOT_PLACEHOLDER
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/hakeem-queue.log
stderr_logfile=/var/log/hakeem-queue.log

[program:hakeem-scheduler]
command=PHP_BIN_PLACEHOLDER PROJECT_ROOT_PLACEHOLDER/artisan schedule:work
directory=PROJECT_ROOT_PLACEHOLDER
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/hakeem-scheduler.log
stderr_logfile=/var/log/hakeem-scheduler.log
