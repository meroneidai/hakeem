services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hakeem-testing:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HAKEEM_HTTP_BIND:-127.0.0.1}:${HAKEEM_HTTP_PORT:-8080}:80"
    env_file:
      - .env.docker
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    volumes:
      - storage_data:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  storage_data:
